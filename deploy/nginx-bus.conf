# คันนี้ดีไหม? — Web tier (Nginx)
# static frontend + reverse proxy /api/* → REST API ที่ฟังเฉพาะ 127.0.0.1:3000
# TLS จบที่ load balancer ของ ruk-com (https://…ruk-com.cloud) แล้วส่งต่อมาที่พอร์ต 80 ของเครื่องนี้

limit_req_zone $binary_remote_addr zone=bus_api:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=bus_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/bus;
    index index.html;

    server_tokens off;
    client_max_body_size 16k;
    limit_req_status 429;

    # IP จริงของผู้ใช้มาจาก load balancer (private network) → ใช้ทำ rate limit
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # เข้าด้วย http → ส่งไป https
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https://upload.wikimedia.org; connect-src 'self'; frame-ancestors 'self'" always;

    location = /api/auth/google   { limit_req zone=bus_auth burst=5 nodelay; include /etc/nginx/snippets/bus-proxy.conf; }
    location /api/                { limit_req zone=bus_api burst=20 nodelay; include /etc/nginx/snippets/bus-proxy.conf; }

    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https://upload.wikimedia.org; connect-src 'self'; frame-ancestors 'self'" always;
    }
}
